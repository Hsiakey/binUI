<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #FFFFFF; }
    /* 仿射圆角矩形探针：第一帧就固定在给定变换上（from = to），逐格检查四个角。
       行 = 缩放组合，列 = 圆角半径。任何一个角"变直"都会一眼看出来。 */
    @keyframes k00 { from { transform: scale(1.28, 0.72); } to { transform: scale(1.28, 0.72); } }
    @keyframes k01 { from { transform: scale(0.72, 1.28); } to { transform: scale(0.72, 1.28); } }
    @keyframes k02 { from { transform: scale(1.8, 0.5); }  to { transform: scale(1.8, 0.5); } }
    @keyframes k03 { from { transform: rotate(20deg); }    to { transform: rotate(20deg); } }
    @keyframes k04 { from { transform: rotate(20deg) scale(1.3, 0.7); } to { transform: rotate(20deg) scale(1.3, 0.7); } }
    @keyframes k05 { from { transform: scale(0.6, 0.6); } to { transform: scale(0.6, 0.6); } }
</style>
</head>
<body>
    <!-- 第 1 行 半径 4 / 10 / 22 / 30（30 会被钳到短边一半） -->
    <div animation="k00 9s linear 0s infinite" style="position:absolute; left:20;  top:20;  width:56; height:56; background:#3E8BFF; border-radius:4"></div>
    <div animation="k00 9s linear 0s infinite" style="position:absolute; left:110; top:20;  width:56; height:56; background:#3E8BFF; border-radius:10"></div>
    <div animation="k00 9s linear 0s infinite" style="position:absolute; left:200; top:20;  width:56; height:56; background:#3E8BFF; border-radius:22"></div>
    <div animation="k00 9s linear 0s infinite" style="position:absolute; left:290; top:20;  width:56; height:56; background:#3E8BFF; border-radius:30"></div>

    <div animation="k01 9s linear 0s infinite" style="position:absolute; left:20;  top:110; width:56; height:56; background:#2FBF9A; border-radius:4"></div>
    <div animation="k01 9s linear 0s infinite" style="position:absolute; left:110; top:110; width:56; height:56; background:#2FBF9A; border-radius:10"></div>
    <div animation="k01 9s linear 0s infinite" style="position:absolute; left:200; top:110; width:56; height:56; background:#2FBF9A; border-radius:22"></div>
    <div animation="k01 9s linear 0s infinite" style="position:absolute; left:290; top:110; width:56; height:56; background:#2FBF9A; border-radius:30"></div>

    <div animation="k02 9s linear 0s infinite" style="position:absolute; left:20;  top:200; width:56; height:56; background:#F2B544; border-radius:4"></div>
    <div animation="k02 9s linear 0s infinite" style="position:absolute; left:110; top:200; width:56; height:56; background:#F2B544; border-radius:10"></div>
    <div animation="k02 9s linear 0s infinite" style="position:absolute; left:200; top:200; width:56; height:56; background:#F2B544; border-radius:22"></div>
    <div animation="k02 9s linear 0s infinite" style="position:absolute; left:290; top:200; width:56; height:56; background:#F2B544; border-radius:30"></div>

    <div animation="k03 9s linear 0s infinite" style="position:absolute; left:20;  top:290; width:56; height:56; background:#FF8A65; border-radius:4"></div>
    <div animation="k03 9s linear 0s infinite" style="position:absolute; left:110; top:290; width:56; height:56; background:#FF8A65; border-radius:10"></div>
    <div animation="k03 9s linear 0s infinite" style="position:absolute; left:200; top:290; width:56; height:56; background:#FF8A65; border-radius:22"></div>
    <div animation="k03 9s linear 0s infinite" style="position:absolute; left:290; top:290; width:56; height:56; background:#FF8A65; border-radius:30"></div>

    <div animation="k04 9s linear 0s infinite" style="position:absolute; left:20;  top:380; width:56; height:56; background:#38BDF8; border-radius:4"></div>
    <div animation="k04 9s linear 0s infinite" style="position:absolute; left:110; top:380; width:56; height:56; background:#38BDF8; border-radius:10"></div>
    <div animation="k04 9s linear 0s infinite" style="position:absolute; left:200; top:380; width:56; height:56; background:#38BDF8; border-radius:22"></div>
    <div animation="k04 9s linear 0s infinite" style="position:absolute; left:290; top:380; width:56; height:56; background:#38BDF8; border-radius:10; border:1px solid #1F2A37"></div>

    <div animation="k05 9s linear 0s infinite" style="position:absolute; left:20;  top:470; width:56; height:56; background:#3E8BFF; border-radius:10"></div>
    <div animation="k05 9s linear 0s infinite" style="position:absolute; left:110; top:470; width:120; height:40; background:#2FBF9A; border-radius:20"></div>
    <div animation="k05 9s linear 0s infinite" style="position:absolute; left:260; top:470; width:40; height:120; background:#F2B544; border-radius:20"></div>
</body>
</html>
