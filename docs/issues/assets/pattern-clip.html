<html width="660" height="470" bg="#EEF2F7">
  <!-- v0.17.2：<pattern> 的内容裁到自己的 tile 框（SVG 规范：tile 框外不画）。
       左边每组的**内容越出 tile**，右边是同款但内容在 tile 内（对照，像素一位不变）。
       上一组：轴对齐 tile（凸窗口 = 矩形）。
       下一组：patternTransform="rotate(30)"（凸窗口 = 平行四边形）。 -->
  <svg width="660" height="470" style="position:absolute;left:0px;top:0px">
    <defs>
      <!-- ① 越界：tile 40x40，圆 r=26（直径 52 > 40） -->
      <pattern id="pOver" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="26" fill="#1D4ED8" />
      </pattern>
      <!-- ② 不越界：同款但 r=16 -->
      <pattern id="pIn" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="16" fill="#1D4ED8" />
      </pattern>
      <!-- ③ 越界矩形（跨两个 tile） -->
      <pattern id="pRect" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect x="-10" y="6" width="60" height="12" fill="#0F766E" />
      </pattern>
      <!-- ④ 旋转 30°：tile 在设备空间是平行四边形 -->
      <pattern id="pRot" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"
               patternTransform="rotate(30)">
        <circle cx="20" cy="20" r="26" fill="#B45309" />
      </pattern>
      <!-- ⑤ 旋转 30° + 内容在 tile 内（对照） -->
      <pattern id="pRotIn" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"
               patternTransform="rotate(30)">
        <rect x="6" y="6" width="28" height="28" fill="#B45309" />
      </pattern>
    </defs>

    <!-- 行 1：轴对齐 -->
    <rect x="16" y="16" width="300" height="120" fill="url(#pOver)" stroke="#94A3B8" stroke-width="1" />
    <rect x="344" y="16" width="300" height="120" fill="url(#pIn)" stroke="#94A3B8" stroke-width="1" />

    <!-- 行 2：越界矩形 -->
    <rect x="16" y="152" width="300" height="120" fill="url(#pRect)" stroke="#94A3B8" stroke-width="1" />
    <rect x="344" y="152" width="300" height="120" fill="#0F766E" stroke="#94A3B8" stroke-width="1" opacity="0.35" />

    <!-- 行 3：旋转 30° -->
    <rect x="16" y="288" width="300" height="150" fill="url(#pRot)" stroke="#94A3B8" stroke-width="1" />
    <rect x="344" y="288" width="300" height="150" fill="url(#pRotIn)" stroke="#94A3B8" stroke-width="1" />

    <text x="16" y="146" font-size="10" fill="#475569">tile 40x40，内容圆 r=26（越界）→ 现在只画 tile 内那部分 / 右：同款 r=16（不越界，像素不变）</text>
    <text x="16" y="282" font-size="10" fill="#475569">越界横条（跨两块）→ 每块只保留自己那份 / 右：纯色对照（横条末端的锯齿说明裁掉了什么）</text>
    <text x="16" y="450" font-size="10" fill="#475569">patternTransform="rotate(30)"：tile 是平行四边形，仍然是凸窗口 / 右：内容不越界的旋转对照</text>
    <text x="16" y="466" font-size="11" fill="#16202C">v0.17.2：&lt;pattern&gt; 内容裁到 tile 框（编译期凸窗口裁剪，格式不变）</text>
  </svg>
</html>
