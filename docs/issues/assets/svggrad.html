<!DOCTYPE html>
<app_window width="420" height="260" bg="#151517" title="svg gradient probe">
<html width="420" height="260" bg="#151517">
<head><meta charset="UTF-8"><style> body { font-size: 12px; color: #ADB2B8; } </style></head>
<body>
<!-- 第一行：线性渐变（横 / 竖 / 45° 多色标 / 带描边的圆自动降级成路径） -->
<svg style="position:absolute; left:18; top:16; width:64; height:64" viewBox="0 0 24 24">
    <defs>
        <linearGradient id="gH" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7AAAFF"/><stop offset="1" stop-color="#F25A5A"/>
        </linearGradient>
        <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F2B544"/><stop offset="1" stop-color="#4ED17E"/>
        </linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7AAAFF"/>
            <stop offset="0.5" stop-color="#F2B544"/>
            <stop offset="1" stop-color="#F25A5A"/>
        </linearGradient>
        <linearGradient id="gDiag" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
            <stop offset="0" stop-color="#4ED17E"/><stop offset="1" stop-color="#7A5AFF"/>
        </linearGradient>
    </defs>
    <path d="M2 2 H22 V22 H2 Z" fill="url(#gH)"/>
</svg>
<svg style="position:absolute; left:98; top:16; width:64; height:64" viewBox="0 0 24 24">
    <path d="M2 2 H22 V22 H2 Z" fill="url(#gV)"/>
</svg>
<svg style="position:absolute; left:178; top:16; width:64; height:64" viewBox="0 0 24 24">
    <path d="M2 2 H22 V22 H2 Z" fill="url(#g3)"/>
</svg>
<svg style="position:absolute; left:258; top:16; width:64; height:64" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="url(#gDiag)" stroke="#0E0E10" stroke-width="1.5"/>
</svg>
<!-- 渐变 + 继承：<g fill="url()"> 让子图形都带渐变 -->
<svg style="position:absolute; left:338; top:16; width:64; height:64" viewBox="0 0 24 24">
    <g fill="url(#gH)">
        <path d="M2 2 H11 V22 H2 Z"/>
        <path d="M13 2 H22 V11 H13 Z"/>
    </g>
</svg>

<!-- 第二行：径向（圆 + 非正方盒成椭圆）、spreadMethod repeat、gradientTransform rotate -->
<svg style="position:absolute; left:18; top:96; width:64; height:64" viewBox="0 0 24 24">
    <defs>
        <radialGradient id="rIn" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFF2B0"/><stop offset="0.55" stop-color="#F2B544"/>
            <stop offset="1" stop-color="#8A4B00"/>
        </radialGradient>
        <radialGradient id="rRep" cx="0.5" cy="0.5" r="0.25" spreadMethod="repeat">
            <stop offset="0" stop-color="#7AAAFF"/><stop offset="1" stop-color="#151517"/>
        </radialGradient>
        <linearGradient id="gRot" gradientTransform="rotate(30 0.5 0.5)">
            <stop offset="0" stop-color="#F25A5A"/><stop offset="1" stop-color="#7AAAFF"/>
        </linearGradient>
    </defs>
    <path d="M2 2 H22 V22 H2 Z" fill="url(#rIn)"/>
</svg>
<svg style="position:absolute; left:98; top:96; width:96; height:64" viewBox="0 0 36 24">
    <path d="M2 2 H34 V22 H2 Z" fill="url(#rIn)"/>
</svg>
<svg style="position:absolute; left:210; top:96; width:64; height:64" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="url(#rRep)"/>
</svg>
<svg style="position:absolute; left:290; top:96; width:64; height:64" viewBox="0 0 24 24">
    <path d="M2 2 H22 V22 H2 Z" fill="url(#gRot)"/>
</svg>
<svg style="position:absolute; left:370; top:96; width:32; height:64" viewBox="0 0 12 24">
    <path d="M1 1 H11 V23 H1 Z" fill="url(#gV)"/>
</svg>

<!-- 第三行：真实图标填渐变 + 渐变描边不支持（按首个色标纯色并告警） -->
<svg style="position:absolute; left:18; top:176; width:64; height:64" viewBox="0 0 24 24">
    <defs>
        <linearGradient id="gIcon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8EE6A0"/><stop offset="1" stop-color="#1E7A4A"/>
        </linearGradient>
        <linearGradient id="gStroke" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#F25A5A"/><stop offset="1" stop-color="#7AAAFF"/>
        </linearGradient>
    </defs>
    <path d="M12 2 L21 7 V13 C21 18 17 21 12 22 C7 21 3 18 3 13 V7 Z" fill="url(#gIcon)"/>
</svg>
<svg style="position:absolute; left:98; top:176; width:64; height:64" viewBox="0 0 24 24">
    <path d="M12 2 L21 7 V13 C21 18 17 21 12 22 C7 21 3 18 3 13 V7 Z"
          fill="#1B1B1E" stroke="url(#gStroke)" stroke-width="1.5"/>
</svg>
<svg style="position:absolute; left:178; top:176; width:64; height:64" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#g3)"/>
</svg>
<span style="position:absolute; left:262; top:180; width:150; height:56; font-size:11px; color:#81858C">linear / radial / spread repeat / gradientTransform / inherit / stroke gradient</span>
<span style="position:absolute; left:18; top:244; width:400; height:14; font-size:11px; color:#81858C">svg gradient: banded fill (quantized levels), 3 backends share one span filler</span>
</body></html>
</app_window>
