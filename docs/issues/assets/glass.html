<!DOCTYPE html>
<app_window width="660" height="470" resizable="false">
<html width="660" height="470">
<head>
<style>
    body { background: #EEF2F7; color: #16202C; }
    .cap { position: absolute; font-size: 12px; color: #E8EEF6; }
</style>
</head>
<body>
    <!-- 背景：渐变 + 大字 + 色块，用来"透过玻璃看" -->
    <div style="position:absolute; left:0; top:0; width:660; height:470;
                background: linear-gradient(135deg, #1E3A8A, #0B5FA5 45%, #14B8A6)">
    </div>
    <div style="position:absolute; left:0; top:0; width:660; height:470;
                background: linear-gradient(0deg, rgba(196,65,12,220), rgba(196,65,12,0))">
    </div>
    <div style="position:absolute; left:20; top:20; width:620; height:70; font-size:56;
                color: #FFFFFF; background: transparent">FROSTED 毛玻璃</div>
    <div style="position:absolute; left:20; top:96; width:620; height:60; font-size:48;
                color: #FFFFFF; background: transparent">material: glass</div>
    <div style="position:absolute; left:30; top:300; width:110; height:110; border-radius: 24;
                background: #F59E0B"></div>
    <div style="position:absolute; left:520; top:300; width:110; height:110; border-radius: 55;
                background: #22C55E"></div>

    <!-- 1) 预设：一句 material 就是一块玻璃（毛玻璃 + 半透明底 + 1px 高光边 + 圆角 + 投影） -->
    <div style="position:absolute; left:30; top:180; width:280; height:150; material: glass"></div>
    <span class="cap" style="left:46; top:200">material: glass</span>

    <!-- 2) 预设 + 局部覆盖：半径/模糊改了，其余沿用预设 -->
    <div style="position:absolute; left:350; top:180; width:280; height:150;
                material: glass; border-radius: 40; backdrop-filter: blur(10px) grain(0.9)"></div>
    <span class="cap" style="left:366; top:200">glass + blur(10) grain(0.9)</span>

    <!-- 3) 深色烟熏 -->
    <div style="position:absolute; left:30; top:350; width:200; height:56; material: smoked"></div>
    <span class="cap" style="left:46; top:366">smoked</span>

    <!-- 4) thin：轻量玻璃（小半径模糊） -->
    <div style="position:absolute; left:250; top:350; width:200; height:56; material: thin"></div>
    <span class="cap" style="left:266; top:366">thin</span>

    <!-- 5) 圆形玻璃按钮：预设 + 圆形覆盖 -->
    <div style="position:absolute; left:470; top:350; width:64; height:64;
                material: glass; border-radius: 32"></div>

    <!-- 6) 手写对照：不开颗粒（能看出颗粒差异） -->
    <div style="position:absolute; left:552; top:350; width:80; height:64;
                border-radius: 20; backdrop-filter: blur(16px);
                background: rgba(255,255,255,0.34);
                border: 1px solid rgba(255,255,255,0.5)"></div>
    <span class="cap" style="left:552; top:418">无颗粒</span>
</body>
</html>
</app_window>
