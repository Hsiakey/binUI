<!DOCTYPE html>
<app_window width="640" height="360" resizable="false">
<html width="640" height="360">
<head>
<style>
    body { background: #F2F5FA; color: #16202C; }
    /* v25 九宫格（image-slice）：同一个 48×48 贴图，左列整图拉伸（边框被拉粗、
       圆角被压扁），右列按 12px 内缩九宫格（四角与边框粗细不变）。 */
</style>
</head>
<body>
    <span style="position:absolute; left:24; top:8; width:360; height:18; font-size:12px; color:#5A6B80">左：整图拉伸　右：image-slice:12</span>
    <span style="position:absolute; left:424; top:8; width:200; height:18; font-size:12px; color:#5A6B80">slice:20 / slice+brightness</span>

    <img src="nine-slice-img.png" style="position:absolute; left:24; top:28; width:180; height:70" />
    <img src="nine-slice-img.png" style="position:absolute; left:224; top:28; width:180; height:70; image-slice:12" />
    <img src="nine-slice-img.png" style="position:absolute; left:424; top:28; width:180; height:70; image-slice:20" />

    <img src="nine-slice-img.png" style="position:absolute; left:24; top:112; width:100; height:100" />
    <img src="nine-slice-img.png" style="position:absolute; left:224; top:112; width:100; height:100; image-slice:12" />
    <img src="nine-slice-img.png" style="position:absolute; left:424; top:112; width:180; height:100; image-slice:12; filter:brightness(0.55)" />

    <img src="nine-slice-img.png" style="position:absolute; left:24; top:224; width:380; height:60" />
    <img src="nine-slice-img.png" style="position:absolute; left:424; top:224; width:180; height:60; image-slice:12" />

    <span style="position:absolute; left:24; top:292; width:360; height:18; font-size:12px; color:#5A6B80">贴边通栏（560×36，slice:16）</span>
    <img src="nine-slice-img.png" style="position:absolute; left:24; top:312; width:580; height:36; image-slice:16" />
</body>
</html>
</app_window>
