<html width="660" height="470" bg="#EEF2F7">
  <!-- v0.16.45：**1× 离屏层里的圆角图片**（这条用例是"VK 图层用错管线"的判据）。
       圆角图片是按行切细条的（BuildImageBands），每条的左右边是**小数**；主目标有 4× MSAA
       兜底，所以大半径的弧线看起来是平滑的。层目标是单采样，如果层里画的东西用的是
       4× MSAA 管线变体（v0.16.44 及以前 VK 就是这样：beginLayerPass 时 layerStack 还是空的，
       refreshPipeline 按主目标选了主管线），采样数状态与目标不一致，弧线每行会差一个像素
       （实测 17 个像素、单通道差 200+）。修法是 pushLayer 在 push_back 之后再选一次管线。
       本页只进跨后端比对；判据是三端 0 不同像素。 -->

  <!-- ① 圆角图片 + 组透明度：最纯粹的复现（没有 filter，也没有模糊） -->
  <div style="position:absolute;left:16px;top:16px;width:92px;height:92px;opacity:0.98">
    <img style="position:absolute;left:0px;top:0px;width:92px;height:92px;border-radius:14px" src="image-round-img.png" />
  </div>
  <!-- ② 同一个图片但半径大得多（弧线更平，差一像素的像素更多） -->
  <div style="position:absolute;left:124px;top:16px;width:92px;height:92px;opacity:0.7">
    <img style="position:absolute;left:0px;top:0px;width:92px;height:92px;border-radius:46px" src="image-round-img.png" />
  </div>
  <!-- ③ 小数坐标 + 小半径：边界卡在像素中心附近最容易翻 */
  <div style="position:absolute;left:236.4px;top:16.7px;width:92px;height:92px;opacity:0.9">
    <img style="position:absolute;left:0px;top:0px;width:92px;height:92px;border-radius:8px" src="image-round-img.png" />
  </div>

    <img style="position:absolute;left:0px;top:0px;width:92px;height:92px;border-radius:20px" src="image-round-img.png" />
  </div>
  <!-- ⑤ 对比：同样的圆角图片不套层（主目标 4× MSAA 路径，一直是 0 差异） -->
  <div style="position:absolute;left:556px;top:16px;width:92px;height:92px">
