<html width="660" height="470" bg="#EEF2F7">
  <!-- 裁剪层里奇数宽度描边的判据页（docs/future.md 里那条未定位差异）。
       历史现象：clip-path 图层内 stroke-width 为**奇数**时，VK 比 GL/D3D11 在每段描边的
       **末端**多 1px（GL 与 D3D11 逐像素相同）；偶数宽度、或者不在图层内都没有差异。
       真正的根因不是裁剪，也不是奇偶：描边几何是**细长四边形**，靠 GPU 的 4× MSAA 出 AA，
       而 4× 的采样子像素位置由 API/驱动决定 —— OpenGL 与 Vulkan 在同一块 GPU 上互为镜像，
       于是"边缘斜着穿过像素"时覆盖率差一档（25%）。轴对齐、45°、以及裁剪外的场景恰好
       在两种采样位置下覆盖数相同，所以看起来像"只有裁剪层里的奇数描边"。
       证据：`<circle>` 描边（圆是折线，整圈都是斜的）在不清裁剪、不套层时就已经差
       320 个像素、最大通道差 123；浅斜线 9.5° 整条差 62/255。
       v0.17.1 把描边改走 CPU 条带覆盖率（与填充同一条路），三端必然逐像素相同 ——
       这条用例就是判据：GL / VK / D3D11 三端 0 不同像素、最大通道差 0。 -->

  <!-- ① 全宽 rect 裁剪：奇数宽度 + 整数/小数 y（最小复现的形状） -->
  <svg width="660" height="470" style="position:absolute;left:0px;top:0px">
    <defs>
      <clipPath id="rectclip"><rect x="0" y="0" width="320" height="130" /></clipPath>
      <clipPath id="pathclip"><path d="M 20 160 L 320 160 L 320 250 L 20 250 Z" /></clipPath>
      <clipPath id="circleclip"><circle cx="130" cy="355" r="78" /></clipPath>
    </defs>

    <g clip-path="url(#rectclip)">
      <line x1="20" y1="20.5" x2="300" y2="20.5" stroke="#9D174D" stroke-width="3" />
      <line x1="20" y1="44" x2="300" y2="44" stroke="#9D174D" stroke-width="3" />
      <line x1="20" y1="66.25" x2="300" y2="66.25" stroke="#9D174D" stroke-width="5" />
      <line x1="20" y1="88" x2="300" y2="88" stroke="#9D174D" stroke-width="1" />
      <line x1="20" y1="110.5" x2="300" y2="110.5" stroke="#9D174D" stroke-width="7" />
    </g>
    <!-- ② 同款不裁剪（对照） -->
    <g>
      <line x1="340" y1="20.5" x2="640" y2="20.5" stroke="#9D174D" stroke-width="3" />
      <line x1="340" y1="44" x2="640" y2="44" stroke="#9D174D" stroke-width="3" />
      <line x1="340" y1="66.25" x2="640" y2="66.25" stroke="#9D174D" stroke-width="5" />
      <line x1="340" y1="88" x2="640" y2="88" stroke="#9D174D" stroke-width="1" />
      <line x1="340" y1="110.5" x2="640" y2="110.5" stroke="#9D174D" stroke-width="7" />
    </g>

    <!-- ③ 斜线 + 折线 + 路径（末端最容易露：每段端点都翻一格） -->
    <g clip-path="url(#pathclip)">
      <line x1="40" y1="176" x2="130" y2="236" stroke="#0F766E" stroke-width="3" />
      <line x1="80" y1="236" x2="80" y2="176" stroke="#0F766E" stroke-width="3" />
      <polyline points="150,176 200,236 250,176 290,226" fill="none" stroke="#0F766E" stroke-width="3" />
      <path d="M 150 242 L 195 182 L 240 242 Z" fill="none" stroke="#0F766E" stroke-width="5" />
    </g>
    <!-- ④ 同款不裁剪（对照） -->
    <g>
      <line x1="360" y1="176" x2="450" y2="236" stroke="#0F766E" stroke-width="3" />
      <line x1="400" y1="236" x2="400" y2="176" stroke="#0F766E" stroke-width="3" />
      <polyline points="470,176 520,236 570,176 610,226" fill="none" stroke="#0F766E" stroke-width="3" />
      <path d="M 470 242 L 515 182 L 560 242 Z" fill="none" stroke="#0F766E" stroke-width="5" />
    </g>

    <!-- ⑤ 圆裁剪：圆描边（整圈都是斜的 —— 这是差异最大的那个场景） -->
    <g clip-path="url(#circleclip)">
      <circle cx="130" cy="355" r="66" fill="none" stroke="#B45309" stroke-width="3" />
      <circle cx="130" cy="355" r="48" fill="none" stroke="#B45309" stroke-width="1" />
      <line x1="40" y1="355" x2="220" y2="355" stroke="#B45309" stroke-width="3" />
      <line x1="130" y1="280" x2="130" y2="430" stroke="#B45309" stroke-width="3" />
    </g>
    <!-- ⑥ 嵌套裁剪：内层 layerStack 非空，走另一条分支 -->
    <g clip-path="url(#pathclip)">
      <g clip-path="url(#circleclip)">
        <circle cx="130" cy="355" r="30" fill="none" stroke="#1D4ED8" stroke-width="5" />
      </g>
    </g>
    <!-- ⑦ 不裁剪的同一组圆（对照） -->
    <circle cx="400" cy="355" r="66" fill="none" stroke="#B45309" stroke-width="3" />
    <circle cx="400" cy="355" r="48" fill="none" stroke="#B45309" stroke-width="1" />
    <line x1="320" y1="355" x2="480" y2="355" stroke="#B45309" stroke-width="3" />
    <path d="M 330 420 L 470 300" stroke="#1D4ED8" stroke-width="5" fill="none" />

  </svg>
  <span style="position:absolute;left:20px;top:134px;width:310px;height:14px;font-size:10px;color:#475569">裁剪内：w3 小数 / w3 整数 / w5 小数 / w1 / w7</span>
  <span style="position:absolute;left:340px;top:134px;width:310px;height:14px;font-size:10px;color:#475569">不裁剪对照（同宽度同 y）</span>
  <span style="position:absolute;left:16px;top:446px;width:630px;height:18px;font-size:11px;color:#4A5A6E">v0.17.1：描边改走 CPU 覆盖率条带 —— 4× MSAA 的采样位置在 GL 与 Vulkan 上互为镜像，斜线覆盖率会差一档</span>
</html>
