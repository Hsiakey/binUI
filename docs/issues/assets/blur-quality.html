  <!-- v0.16.44：模糊质量 —— 把"降采样链 ≈ 高斯"换成"降采样 + 真正的分离高斯"两趟。
       旧实现：每级 2× 盒平均，最后把**最粗那一级**双线性放大回原位。半径大、元素小时的
       最粗级只剩 5~7 个纹素，放大后边缘是"斜坡 + 折点"（像梯形/平台）。
       新实现：降采样只降到 σ 还剩 ≥2 纹素的那一级，再在那一级上跑横/纵两趟
       **密采样**加权卷积（每个纹素一个抽头、覆盖 ±3σ、加法混合累加、权重和 = 255），
       所以边缘是一条真正的高斯斜坡（S 形、无折点）。
       本页只进跨后端比对（GDI 遗留路径不模糊）。 -->
