<!DOCTYPE html>

<title>binUI Agent · 双视图原型（聊天 / Galgame）</title>
<style>
  /* =====================================================================
     双视图原型：同一份 transcript，两个渲染器
       · 聊天视图  —— 全量、可滚动、可复制（上下文窗口）
       · Galgame 视图 —— Director 把 transcript 投影成「节拍」，打字机 + 翻页，
                         念不出来的内容（代码/表格/清单）路由到右侧详情面板
     只使用 binUI 支持的图元，方便之后移植。
     ===================================================================== */

  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0810;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;

  }
  .stage { position: relative; width: 1000px; height: 700px; background: #171223; overflow: hidden; user-select: none; }
  .abs { position: absolute; }

  /* ---------------- 背光（舞台感，两视图共用） ---------------- */

  .glow-a { left: 210px; top: 96px;  width: 580px; height: 580px; background: rgba(139,92,246,0.10); }
  .glow-b { left: 300px; top: 156px; width: 400px; height: 400px; background: rgba(167,139,250,0.10); }

  /* ================= Galgame 视图 ================= */

  #hero { left: 270px; top: 145px; width: 460px; height: 460px; z-index: 2;
          animation: idleBob 3.2s ease-in-out infinite; }

  .chip { background: rgba(18,14,26,0.86); border-radius: 12px; }
  .chapter { left: 30px; top: 64px; width: 200px; height: 56px; z-index: 8; }
  .chapter .k { left: 14px; top: 9px; color: #C4B5FD; font-size: 11px; letter-spacing: 1px; }
  .chapter .v { left: 14px; top: 28px; color: #E9E4F5; font-size: 13px; }

  /* 控制条 */

  #galName { left: 152px; top: 16px; width: 300px; color: #C4B5FD; font-size: 18px; z-index: 13; }
  #galBody { left: 152px; top: 52px; width: 740px; height: 84px; color: #F5F5F7; font-size: 16px;

  #galMark { right: 18px; bottom: 12px; color: #A78BFA; font-size: 13px; z-index: 14;
             display: none; animation: hintBlink 1.1s ease-in-out infinite; }

  /* 状态行：对话框下方的模型 / 思考强度 / CTX */

  /* backlog 覆盖层 */

  #backlog .b-close { right: 16px; top: 12px; width: 22px; height: 22px; color: #8A8A95; font-size: 14px;

  .bubble { background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.22);

<body>
<div class="stage">

  <div class="abs glow glow-a"></div>
  <div class="abs glow glow-b"></div>

<script>
/* ============================================================
   1) Transcript —— 唯一真源（后端保留全部）
   ============================================================ */
const transcript = [];          // { role:'agent'|'user', content:'...' }

const GREETING =
  '……啊，你终于来了。我是诺艾拉，这个界面的向导。直接说的话，我会用打字机讲给你听；内容太长的话，我会整理到右侧面板。';

const REPLIES = [
  '让我把思路拆开说。\n\n' +
  '首先，双视图的核心是同一份 transcript 供两个渲染器读取：聊天视图全量呈现，galgame 视图则通过一个 director 把它切成节拍。\n\n' +
  '需要处理的边界有这样几类：\n' +
  '- 代码块与表格：念不出来，交给右侧详情面板\n' +
  '- 超长段落：按句子切分成多拍\n' +
  '- 推理过程：折叠进内心独白\n' +
  '- 玩家输入：走同一份 transcript 同步\n\n' +
  '下面是一段示意代码：\n\n' +
  '```cpp\n' +
  'struct Beat {\n    int     msgIndex;\n    Channel channel;   // speak | detail\n    std::string text;\n};\n' +
  '```\n\n' +
  '大概就是这样，细节我都放在右边了。',
  '好的，我记下了。还有别的想问的吗？直接说就行。'
];
let replyCount = 0;
function replyFor() { return REPLIES[Math.min(replyCount++, REPLIES.length - 1)]; }

/* ============================================================
   2) Director —— transcript → galgame 节拍
   ============================================================ */
// 2.1 分段：先切代码围栏，再按空行分段，超长段落按句子切
function segment(text) {
  const blocks = [];
  const re = /```[\s\S]*?```/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) blocks.push({ kind: 'text', text: text.slice(last, m.index) });
    blocks.push({ kind: 'code', text: m[0] });
    last = re.lastIndex;
  }
  if (last < text.length) blocks.push({ kind: 'text', text: text.slice(last) });

  const out = [];
  for (const b of blocks) {
    if (b.kind === 'code') { out.push({ kind: 'code', text: b.text.trim() }); continue; }
    const paras = b.text.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
    for (const para of paras) {
      if (para.length <= 90) { out.push({ kind: 'plain', text: para }); continue; }
      const sents = para.split(/(?<=[。！？.!?])/).map(s => s.trim()).filter(Boolean);
      let cur = '';
      for (const s of sents) {
        if (cur && (cur + s).length > 90) { out.push({ kind: 'plain', text: cur }); cur = s; }
        else cur += s;
      }
      if (cur) out.push({ kind: 'plain', text: cur });
    }
  }
  return out;
}

// 2.2 分频道：speak（对话盒） / detail（详情面板）
function classify(block, msg, msgIndex) {
  let channel = 'speak', kind = 'plain', panel = block.text;
  if (block.kind === 'code') {
    channel = 'detail'; kind = 'code';
    panel = block.text.replace(/^```[^\n]*\n?/, '').replace(/\n?```$/, '');
  } else if (/\|.*\|/.test(block.text) && block.text.split('\n').length >= 2) {
    channel = 'detail'; kind = 'table';
  } else if ((block.text.match(/^\s*([-*]|\d+\.)\s/gm) || []).length >= 3) {
    channel = 'detail'; kind = 'list';
  }
  const speaker = msg.role === 'user' ? '你' : '诺艾拉';
  const leadMap = { code: '代码我整理到右侧面板了：', table: '表格整理在右侧：', list: '清单给你放在右边了：' };
  return {
    msgIndex, role: msg.role, channel, kind,
    text: block.text, panel, speaker,
    lead: channel === 'detail' ? leadMap[kind] : block.text
  };
}

function project(msg, msgIndex) {
  return segment(msg.content).map(b => classify(b, msg, msgIndex));
}

/* ============================================================
   3) Galgame 播放机
   ============================================================ */
let mode = 'gal';
let beats = [];
let beatIndex = -1;
let state = 'idle';            // idle | typing | wait | input
let cur = null;
let fullText = '', typed = 0;
let typeTimer = null, pending = null, autoOn = false;
let currentMsgIndex = 0;

const $ = id => document.getElementById(id);
const galBody = $('galBody'), galName = $('galName'), galEdit = $('galEdit'), galMark = $('galMark');
const detailPanel = $('detailPanel'), dTitle = $('dTitle'), dBody = $('dBody'), dCopy = $('dCopy');
const backlog = $('backlog'), bList = $('bList');
const chatList = $('chatList'), chatEdit = $('chatEdit');

function startBeats() { beatIndex = -1; nextBeat(); }

function nextBeat() {
  clearTimeout(pending); pending = null;
  closeDetail();
  hideEdit();
  beatIndex++;
  if (beatIndex >= beats.length) { enterInput(); return; }
  beginType(beats[beatIndex]);
}

function beginType(beat) {
  cur = beat;
  galName.textContent = beat.speaker;
  currentMsgIndex = beat.msgIndex;
  fullText = beat.channel === 'detail' ? beat.lead : beat.text;
  galBody.textContent = ''; typed = 0;
  galMark.style.display = 'none';
  if (beat.role === 'user') { galBody.textContent = fullText; finishType(); return; }
  state = 'typing';
  typeTimer = setInterval(tick, 22);
}

function tick() {
  typed++;
  galBody.textContent = fullText.slice(0, typed);
  if (typed >= fullText.length) finishType();
}

function finishType() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  galBody.textContent = fullText;
  state = 'wait';
  galMark.style.display = (beatIndex < beats.length - 1) ? 'block' : 'none';
  if (cur.channel === 'detail') openDetail(cur);
  if (cur.role === 'user') pending = setTimeout(nextBeat, 450);
  else if (autoOn) pending = setTimeout(nextBeat, 900);
}

function advance() {
  if (mode !== 'gal') return;
  if (state === 'typing') { finishType(); return; }
  if (state === 'wait') { nextBeat(); return; }
}

function enterInput() {
  state = 'input';
  galName.textContent = '你';
  galBody.textContent = '';
  galMark.style.display = 'none';
  galEdit.style.display = 'block';
  galEdit.value = '';
  galEdit.focus();
}
function hideEdit() { galEdit.style.display = 'none'; }

/* ============================================================
   4) 提交输入（两视图共用一条路径）
   ============================================================ */
function submitUser(text) {
  text = (text || '').trim();
  if (!text) return;

  const ui = transcript.length;
  transcript.push({ role: 'user', content: text });
  beats.push(...project(transcript[ui], ui));

  const ai = transcript.length;
  transcript.push({ role: 'agent', content: replyFor() });
  beats.push(...project(transcript[ai], ai));

  if (mode === 'chat') { renderChat(); scrollBottom(); }
  else { nextBeat(); }
}

/* ============================================================
   5) 详情面板 / backlog / 聊天视图渲染
   ============================================================ */
function openDetail(beat) {
  dTitle.textContent = '详情 · ' + ({ code: '代码', table: '表格', list: '清单' }[beat.kind] || '内容');
  dBody.textContent = beat.panel;
  detailPanel.style.display = 'block';
}
function closeDetail() { detailPanel.style.display = 'none'; }

function toggleBacklog(force) {
  const show = force === undefined ? backlog.style.display !== 'block' : force;
  if (show) { renderBacklog(); backlog.style.display = 'block'; bList.scrollTop = bList.scrollHeight; }
  else backlog.style.display = 'none';
}
function renderBacklog() {
  bList.innerHTML = '';
  const played = beats.slice(0, Math.min(beatIndex + 1, beats.length));
  played.forEach(b => {
    const item = document.createElement('div');
    item.className = 'bk-item';
    const who = document.createElement('span');
    who.className = 'bk-who' + (b.role === 'user' ? ' user' : '');
    who.textContent = b.speaker;
    const txt = document.createElement('span');
    txt.className = 'bk-txt';
    txt.textContent = (b.channel === 'detail' ? b.lead : b.text).slice(0, 48);
    item.appendChild(who); item.appendChild(txt);
    item.onclick = () => { toggleBacklog(false); setMode('chat'); scrollToMsg(b.msgIndex); };
    bList.appendChild(item);
  });
}

function renderChat() {
  chatList.innerHTML = '';
  transcript.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'msg ' + m.role;
    row.dataset.i = i;
    const av = document.createElement('div'); av.className = 'av ' + m.role;
    if (m.role === 'agent') {
      const im = document.createElement('img');
      im.src = '../../tests/NOELA_N001_1227x1227.png';
      im.alt = '';
      av.appendChild(im);
    } else {
      av.textContent = '你';
    }
    const col = document.createElement('div'); col.className = 'col';
    const who = document.createElement('div'); who.className = 'who';
    who.textContent = m.role === 'user' ? '你' : '诺艾拉';
    col.appendChild(who);
    const bubble = document.createElement('div'); bubble.className = 'bubble';
    renderContent(bubble, m.content);
    col.appendChild(bubble);
    const cp = document.createElement('div'); cp.className = 'copy'; cp.textContent = '复制';
    cp.onclick = () => { try { navigator.clipboard.writeText(m.content); } catch (e) {}
                         cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制', 1200); };
    col.appendChild(cp);
    row.appendChild(av);
    row.appendChild(col);
    chatList.appendChild(row);
  });
}
function renderContent(el, text) {
  const re = /```([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) addText(el, text.slice(last, m.index));
    const pre = document.createElement('pre');
    pre.textContent = m[1].replace(/^\n/, '').replace(/^[a-zA-Z0-9_+-]*\n/, '').replace(/\n$/, '');
    el.appendChild(pre);
    last = re.lastIndex;
  }
  if (last < text.length) addText(el, text.slice(last));
}
function addText(el, s) {
  if (!s.trim()) return;
  const p = document.createElement('div'); p.className = 'txt'; p.textContent = s.trim();
  el.appendChild(p);
}
function scrollBottom() { chatList.scrollTop = chatList.scrollHeight; }
function scrollToMsg(i) {
  const el = chatList.querySelector('[data-i="' + i + '"]');
  if (el) el.scrollIntoView({ block: 'center' });
}

/* ============================================================
   6) 视图切换
   ============================================================ */
function setMode(next) {
  if (next === mode) return;
  mode = next;
  document.querySelectorAll('.mode-seg').forEach(s => s.classList.toggle('active', s.dataset.mode === mode));
  $('galView').style.display  = mode === 'gal' ? 'block' : 'none';
  $('chatView').style.display = mode === 'chat' ? 'block' : 'none';

  if (mode === 'chat') { renderChat(); scrollToMsg(currentMsgIndex); }
  else { if (state !== 'typing' && beatIndex < beats.length - 1) nextBeat(); }
}

/* ============================================================
   7) 事件绑定
   ============================================================ */
document.querySelectorAll('.mode-seg').forEach(seg => seg.onclick = () => setMode(seg.dataset.mode));

$('skipBtn').onclick = advance;
$('autoBtn').onclick = () => { autoOn = !autoOn; $('autoBtn').classList.toggle('on', autoOn); };
$('logBtn').onclick  = () => toggleBacklog();
$('fullBtn').onclick = () => { setMode('chat'); scrollToMsg(currentMsgIndex); };
$('dClose').onclick  = closeDetail;
$('dCopy').onclick   = () => { try { navigator.clipboard.writeText(dBody.textContent); } catch (e) {}
                              dCopy.textContent = '已复制'; setTimeout(() => dCopy.textContent = '复制', 1200); };
$('bClose').onclick  = () => toggleBacklog(false);

// galgame 视图：滚轮上滑 = 打开历史（backlog），滑到底再下滑 = 收起
$('galView').addEventListener('wheel', e => {
  if (mode !== 'gal') return;
  if (detailPanel.style.display === 'block') return;         // 详情面板内滚动不触发
  if (e.deltaY < 0) {
    if (backlog.style.display !== 'block') { toggleBacklog(true); e.preventDefault(); }
  } else if (e.deltaY > 0 && backlog.style.display === 'block') {
    const atBottom = bList.scrollTop + bList.clientHeight >= bList.scrollHeight - 2;
    if (atBottom) { toggleBacklog(false); e.preventDefault(); }
  }
}, { passive: false });

galEdit.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = galEdit.value; galEdit.value = '';
    submitUser(v);
  }
});
chatEdit.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
function sendChat() { const v = chatEdit.value; chatEdit.value = ''; updateSendState(); submitUser(v); }
function updateSendState() { $('chatSend').classList.toggle('active', chatEdit.value.trim().length > 0); }
chatEdit.addEventListener('input', updateSendState);
document.getElementById('chatSend').onclick = sendChat;

document.addEventListener('keydown', e => {
  if (e.target === galEdit || e.target === chatEdit) return;
  if (e.key === 'Escape') { closeDetail(); toggleBacklog(false); return; }
  if (mode === 'gal' && e.key === 'Enter') { e.preventDefault(); advance(); }
});

/* ============================================================
   8) 启动
   ============================================================ */
transcript.push({ role: 'agent', content: GREETING });
beats.push(...project(transcript[0], 0));
renderChat();
startBeats();
</script>
</body>
</html>
