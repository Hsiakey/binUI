<!--
  tag.bum.html —— 标准组件库里的最小组件（2 行 + 3 条 class 就能说明写法）

  组件源码的推荐写法就是 .bum.html —— 和主 UI 的 main.html 同一套语法、同一个元素
  解析器：<style> 会并入宿主样式表、class / 伪类 / attr() 都能用、参数占位一样替换、
  <use> 嵌套一样生效。

  历史写法 .bum.xml 继续被识别，能力完全一样（编译器按内容选解析器，不看扩展名）；
  新写的组件用 .bum.html 就行。

  <use src="tag.bum.html" .../>  显式扩展名
  <use src="tag.bum" .../>       写 .bum（二进制名，源码在就回落到 tag.bum.html）
  <use src="tag" .../>           只写名字，自动探测

  参数：text 文案 / kind 配色（blue 默认, mint, amber, gray）/ w 宽 / fs 字号
-->
<style>
    .bui-tag        { background: #EEF3FA; color: #66768C; border-radius: 9; font-size: 12px; }
    .bui-tag.mint   { background: #E3F7F1; color: #1E9C7C; }
    .bui-tag.amber  { background: #FDF3DC; color: #B07811; }
    .bui-tag.gray   { background: #EEF3FA; color: #66768C; }
</style>
<span class="bui-tag {{kind=blue}}" style="width:{{w=72}}; height:20; font-size:{{fs=12}}; text-align:center">{{text=标签}}</span>
