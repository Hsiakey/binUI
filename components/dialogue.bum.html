<!--
  dialogue.bum.html —— 对话气泡卡：角色名胶囊 + 正文 + 右下两个按钮
  纵向 flex 排版，任意 w/h 都不会错位：
      [角色名胶囊]
      [正文 flex:1 —— 按卡片宽度自动换行]
      [确定][取消]（justify-content: flex-end 贴右）
  参数：name 角色名 / text 正文 / ok / cancel 按钮文案
        w 宽 / h 高 / pad 内边距 / namew 名字胶囊宽度 / bw 按钮宽 / btnh 按钮高
-->
<style>
    .bui-dlg        { background:#FFFFFF; border:1px solid #E6EDF7; }
    .bui-dlg-name   { background:#E8F1FF; color:#2F79E8; border-radius: 12px; font-size: 13px;
                      font-weight:700; }
    .bui-dlg-text   { color:#1F2A37; font-size: 14px; line-height:170%; }
    .bui-dlg-ok     { background:#3E8BFF; color:#FFFFFF; border-radius: 10px; font-size: 13px;
                      transition: background-color .18s ease; }
    .bui-dlg-ok:hover  { background:#5DA0FF; }
    .bui-dlg-ok:active { background:#2F79E8; }
    .bui-dlg-cancel { background:#EEF3FA; color:#3E8BFF; border-radius: 10px; font-size: 13px;
                      transition: background-color .18s ease; }
    .bui-dlg-cancel:hover  { background:#E1EBFA; }
    .bui-dlg-cancel:active { background:#D2E2F8; }
</style>

    <span class="bui-dlg-name" style="width:var(--namew, 84px);height:24px" data-param="name">角色</span>
    <span class="bui-dlg-text" style="flex:1" data-param="text">正文</span>
    <div style="height:var(--btnh, 32px);display:flex;justify-content:flex-end;gap:8px">
        <button class="bui-dlg-ok" style="width:var(--bw, 80px);height:var(--btnh, 32px)" data-param="ok">确定</button>
        <button class="bui-dlg-cancel" style="width:var(--bw, 80px);height:var(--btnh, 32px)" data-param="cancel">取消</button>
    </div>
