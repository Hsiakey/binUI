<!--
  titlebar.bum.html —— 标准标题栏
      左：  图标  标题  副标题
      右：  最小化 —   最大化 ▢   关闭 ✕（三颗都是元素画的 10×10 图标，不是字形）
  整条用 flex 排版，窗口多宽都不用宿主算按钮坐标。
  根元素是 <titlebar>，所以窗口拖动（isTitlebarDrag）照常生效。

  参数                     默认          说明
    title      标题          标题          主标题 14px / 700 / #1F2A37
    titlew     标题宽度      content       content = 按标题文字宽度排（编译器估算，和换行同一套度量）；
                                           也可以给具体像素值
    sub        副标题        （空）        11px / #94A3B8，左对齐紧跟标题
    icon       左侧图标      （空）        一个字形，例如 ◆ ♻ ✏；建议配 iconw
    iconw      图标宽度      1             不给就只是 1px 占位（不传图标时不用管）
    h          高度          45            单数：按钮 29 高时 (45-29)/2 = 8 才能落在整行上
    pad        左内边距      16
    padr       右内边距      12
    bs         按钮边长      29            单数：1px 图标（横线）能正好压在中线那一行上
                                           ⚠ 图标是元素按 29×29 坐标系写死的，改 bs 要同步改图标坐标
    gap        元素间距      6
    idmin      最小化按钮 id win-min
    idmax      最大化按钮 id win-max
    idclose    关闭按钮 id   win-close

  ⚠ 参数不要写进 <style>：组件样式表会并入宿主且是**全局**的，多个实例互相覆盖。
    所有可调值都走内联 style；<style> 里只放"同一套皮肤"的固定规则。
-->
<style>
    .bui-tb       { background:#FFFFFF; border-bottom:1px solid #E6EDF7; }
    .bui-tb-icon  { color:#3E8BFF; font-size:18px; }
    .bui-tb-title { color:#1F2A37; font-size:14px; font-weight:700; }
    .bui-tb-sub   { color:#94A3B8; font-size:11px; }
    .bui-tb-btn   { background:#EEF3FA; color:#66768C; border-radius:8; font-size:12px;
                    transition: background-color .15s ease; }
    .bui-tb-btn:hover  { background:#DCE5F2; }
    .bui-tb-btn:active { background:#C7D8EE; }
    .bui-tb-close { background:#FFE9EC; color:#FF6B6B; border-radius:8; font-size:12px;
                    transition: background-color .15s ease; }
    .bui-tb-close:hover  { background:#FFD9DE; }
    .bui-tb-close:active { background:#FFC6CE; }
    /* 最大化图标：9×9 空心方框（单数尺寸，1px 边框落在第 10 和第 18 行，正中是第 14 行） */
    .bui-tb-sq    { border:1px solid #66768C; }
    /* 最小化图标：9×1 实心横条，落在第 14 行 —— 29 高的按钮中线就是第 14 行，上下各留 14 行。
       这就是把按钮和图标都改成单数的目的：偶数尺寸时中线落在两行交界，1px 线永远差半像素。 */
    .bui-tb-bar   { background:#66768C; }
</style>
<titlebar class="bui-tb" ui_scale="fixed" style="height:{{h=45}}; display:flex; align-items:center; gap:{{gap=6}}">
    <div style="width:{{pad=16}}; height:1; background:transparent"></div>
    <span class="bui-tb-icon" style="width:{{iconw=1}}; height:22">{{icon=}}</span>
    <span class="bui-tb-title" style="width:{{titlew=content}}; height:20">{{title=标题}}</span>
    <span class="bui-tb-sub" style="flex:1; height:16">{{sub=}}</span>
    <!-- 三颗控制图标：不用字形，直接用元素画 —— 字形墨迹宽高受字体度量摆布（横线、方块、
         ✕ 在同一个字号下差 30%），换字体/换 DPI 还会再变。元素画的图标几何完全由坐标决定：
         按钮 29×29（单数），图标 9×9（单数），横线落在正中第 14 行，方框边框落在第 10/18 行。
         按钮本身负责点击/悬停/焦点环，图标是它内部的绝对定位子节点（不参与命中测试，
         鼠标事件照样落到按钮上）。 -->
    <button id="{{idmin=win-min}}"   class="bui-tb-btn"   style="width:{{bs=29}}; height:{{bs=29}}; padding:0">
        <div class="bui-tb-bar" style="position:absolute; left:10; top:14; width:9; height:1"></div>
    </button>
    <button id="{{idmax=win-max}}"   class="bui-tb-btn"   style="width:{{bs=29}}; height:{{bs=29}}; padding:0">
        <div class="bui-tb-sq" style="position:absolute; left:10; top:10; width:9; height:9"></div>
    </button>
    <button id="{{idclose=win-close}}" class="bui-tb-close" style="width:{{bs=29}}; height:{{bs=29}}; padding:0">
        <svg style="position:absolute; left:0; top:0; width:29; height:29">
            <line x1="10.5" y1="10.5" x2="18.5" y2="18.5" stroke="#FF6B6B" stroke-width="1"/>
            <line x1="18.5" y1="10.5" x2="10.5" y2="18.5" stroke="#FF6B6B" stroke-width="1"/>
        </svg>
    </button>
    <div style="width:{{padr=12}}; height:1; background:transparent"></div>
</titlebar>
