<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D：应用自己画，binUI 只负责 UI</title>
    <style>
        body { font-size: 13px; color: #1F2A37; }
        .card { background: #FFFFFF; border: 1px solid #E6EDF7; border-radius: 16px; }
        .card-title { font-size: 13px; font-weight: 700; color: #1F2A37; }
        .note { font-size: 11px; color: #94A3B8; }
    </style>
</head>
<body>
<div data-binui-window data-width="900" data-height="640" data-bg="#F4F7FC" data-title="3D 演示" data-window-resize="disable" data-ui-scale="proportional">
    <titlebar class="bui-tb" style="position:absolute;left:0px;top:0px;width:900px;height:45px;display:flex;align-items:center;gap:6px;--x:0px;--y:0px;--w:900px;--icon:◈;--iconw:22px;--title:3D 渲染;--sub:引擎只管 UI；线框立方体由应用自己在 canvas 回调里算" data-component="../../components/titlebar.bum.html" ui_scale="fixed" data-x="0" data-y="0" data-w="900" data-icon="◈" data-iconw="22" data-title="3D 渲染" data-sub="引擎只管 UI；线框立方体由应用自己在 canvas 回调里算"></titlebar>

    <!-- 视口：立方体画在这块卡片上（应用在 drawFn 里用 gfx.fillLine 画） -->
    <div class="card" style="position:absolute;left:16px;top:56px;width:868px;height:520px">
        <span class="card-title" style="position:absolute;left:16px;top:12px;width:400px;height:18px">线框立方体：12 条边，透视投影，逐边按深度调色</span>
        <span class="note" style="position:absolute;left:16px;top:34px;width:520px;height:16px">binUI 没有 3D：顶点变换、投影、排序都在应用里做，引擎只提供 fillRect / fillRounded / fillLine</span>
        <span class="note" style="position:absolute;left:640px;top:12px;width:212px;height:16px">拖动标题栏移动 · ESC 退出</span>
        <!-- 视口底纹：地面网格 + 坐标轴，让空视口也能看出是 3D 场景 -->
        <svg style="position:absolute;left:16px;top:60px;width:836px;height:436px">
            <line x1="0" y1="330" x2="836" y2="330" stroke="#DCE5F2" stroke-width="1"/>
            <line x1="0" y1="200" x2="836" y2="200" stroke="#EAF0F8" stroke-width="1"/>
            <line x1="120" y1="330" x2="330" y2="430" stroke="#EAF0F8" stroke-width="1"/>
            <line x1="716" y1="330" x2="506" y2="430" stroke="#EAF0F8" stroke-width="1"/>
            <line x1="120" y1="330" x2="300" y2="250" stroke="#EAF0F8" stroke-width="1"/>
            <line x1="716" y1="330" x2="536" y2="250" stroke="#EAF0F8" stroke-width="1"/>
        </svg>
        <span class="note" style="position:absolute;left:16px;top:486px;width:836px;height:16px">立方体是 canvas 回调逐帧画的；离屏渲染跑不到 drawFn，只会画出周围这些辅助线</span>
    </div>

    <!-- 状态条 -->
    <div class="card" style="position:absolute;left:16px;top:588px;width:868px;height:40px">
        <span id="cube-state" style="position:absolute;left:16px;top:12px;width:840px;height:18px;font-size:12px;color:#38445A">顶点变换 + 透视投影 + 逐边按深度调色，全部在应用里算；引擎只提供 fillLine / fillRect</span>
    </div>
</div>
</body>
</html>
