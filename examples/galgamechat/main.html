<!DOCTYPE html>
<app_window width="960" height="720" bg="#0C0A18" title="binUI Galgame Chat" window_resize="disable">
<html width="960" height="720" bg="#0C0A18">
<head>
    <meta charset="UTF-8">
    <title>binUI Galgame Chat</title>
    <style>
        body { font-family: "Microsoft YaHei UI"; }
        @keyframes idleBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.28; }
            50%      { opacity: 0.62; }
        }
        @keyframes hintBlink {
            0%, 100% { opacity: 0.25; }
            50%      { opacity: 1.0; }
        }
        button { transition: background-color 0.18s ease, transform 0.18s ease; }
    </style>
</head>
<body>
    <!-- 标题栏 -->
    <titlebar style="position:absolute; left:0; top:0; width:960; height:44; background:#08060F; z-index:100">
        <span style="position:absolute; left:16; top:13; width:420; height:20; color:#E9E4F5; font-size:14; z-index:101">binUI · Galgame Chat</span>
        <span style="position:absolute; left:560; top:15; width:300; height:16; color:#6E6E78; font-size:11; z-index:101">Enter 推进 / 发送 · 拖动标题栏移动</span>
        <button id="btnMin"   style="position:absolute; left:872; top:8; width:28; height:28; background:#23232E; border-radius:6; z-index:110">─</button>
        <button id="btnClose" style="position:absolute; left:908; top:8; width:28; height:28; background:#E5484D; border-radius:6; z-index:110">✕</button>
    </titlebar>

    <!-- 舞台背景：底部基调 + 两团呼吸背光 -->
    <div style="position:absolute; left:0; top:44; width:960; height:676; background:#12102A; z-index:0"></div>
    <div style="position:absolute; left:410; top:96; width:560; height:460; background:rgba(96,74,196,0.16); border-radius:280; z-index:0; animation:glowPulse 4.2s ease-in-out 0s infinite"></div>
    <div style="position:absolute; left:520; top:150; width:360; height:360; background:rgba(160,130,250,0.14); border-radius:180; z-index:0; animation:glowPulse 4.2s ease-in-out 0.8s infinite"></div>

    <!-- 地板 -->
    <div style="position:absolute; left:0; top:470; width:960; height:86; background:#0A0814; z-index:0"></div>
    <div style="position:absolute; left:0; top:470; width:960; height:2; background:rgba(167,139,250,0.45); z-index:0"></div>

    <!-- 立绘：放大并出底（下半部被对话框压住） -->
    <img id="hero" src="NOELA_N001_1227x1227.png"
         animation="idleBob 3.6s ease-in-out 0s infinite"
         style="position:absolute; left:420; top:60; width:530; height:530; z-index:0"></img>

    <!-- 顶部渐隐（压住立绘顶部，营造舞台纵深） -->
    <div style="position:absolute; left:0; top:44; width:960; height:70; background:rgba(12,10,24,0.55); z-index:0"></div>

    <!-- HUD -->
    <div style="position:absolute; left:24; top:64; width:300; height:44; background:rgba(14,11,26,0.80); border-radius:10; z-index:5">
        <span style="position:absolute; left:14; top:6; width:272; height:18; color:#8A8A95; font-size:11; z-index:6">CHAPTER 01</span>
        <span style="position:absolute; left:14; top:22; width:272; height:18; color:#E9E4F5; font-size:13; z-index:6">与向导的对话</span>
    </div>
    <div style="position:absolute; left:748; top:64; width:188; height:30; background:rgba(14,11,26,0.80); border-radius:10; z-index:5">
        <span style="position:absolute; left:14; top:7; width:160; height:16; color:#7BE0B0; font-size:12; z-index:6">● 在线 · Galgame 模式</span>
    </div>

    <!-- 对话框卡片：阴影 + 卡片 + 左侧强调条 + 滚动容器 -->
    <div style="position:absolute; left:26; top:502; width:912; height:148; background:rgba(0,0,0,0.45); border-radius:20; z-index:0"></div>
    <div  id="logBg" style="position:absolute; left:24; top:498; width:912; height:148; background:rgba(16,13,30,0.95); border-radius:18; z-index:0"></div>
    <div style="position:absolute; left:24; top:498; width:7; height:148; background:rgba(139,92,246,0.95); border-radius:4; z-index:0"></div>
    <div  id="log"   style="position:absolute; left:24; top:498; width:912; height:148; overflow:hidden; border-radius:18; z-index:0"></div>
    <span id="hint"  style="position:absolute; left:838; top:618; width:92; height:18; color:#A78BFA; font-size:12; z-index:10; animation:hintBlink 1.1s ease-in-out 0s infinite">▽ 按 Enter</span>

    <!-- 输入栏（玩家回合显示） -->
    <div id="composer" style="position:absolute; left:24; top:658; width:912; height:50; background:rgba(30,25,50,0.97); border-radius:14; z-index:10">
        <div style="position:absolute; left:0; top:0; width:7; height:50; background:rgba(123,224,176,0.95); border-radius:4; z-index:11"></div>
        <span style="position:absolute; left:18; top:15; width:40; height:22; color:#7BE0B0; font-size:15; z-index:11">你</span>
        <input id="chatInput" style="position:absolute; left:64; top:10; width:742; height:30; background:rgba(255,255,255,0.06); border-radius:8; font-size:15; color:#E9E4F5; z-index:11"></input>
        <span style="position:absolute; left:814; top:16; width:88; height:18; color:#6E6E78; font-size:11; z-index:11">Enter 发送</span>
    </div>
</body>
</html>
