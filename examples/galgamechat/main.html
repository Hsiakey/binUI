<!DOCTYPE html>
<app_window width="960" height="720" bg="#F4F7FC" title="binUI Galgame Chat" window_resize="disable">
<html width="960" height="720" bg="#F4F7FC">
<head>
    <meta charset="UTF-8">
    <title>binUI Galgame Chat</title>
    <style>
        /* 浅色主题：底 #F4F7FC / 面 #FFFFFF / 次级面 #EEF3FA / 线 #E6EDF7 / #DCE5F2
           主字 #1F2A37 / 次字 #66768C / 弱字 #94A3B8 / 主色 #3E8BFF / 薄荷 #2FBF9A */
        body { font-family: "Microsoft YaHei UI"; font-size: 13px; color: #1F2A37; }
        @keyframes idleBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.30; }
            50%      { opacity: 0.68; }
        }
        @keyframes hintBlink {
            0%, 100% { opacity: 0.25; }
            50%      { opacity: 1.0; }
        }
        button { transition: background-color 0.18s ease, transform 0.18s ease; }

        /* 窗口按钮：浅蓝底 + 次字色（悬停只加深底色，字色不变才能一直看清） */


        /* 阅读面板：C++ 侧追加的正文是固定白字、角色名固定淡紫/薄荷，
           所以这一块留深墨蓝，白字与浅色名字都清晰（换成浅底会白成一片） */
        #logBg { background: #2C3F5E; border: 1px solid #3D5273; border-radius: 18; }
        #hint  { color: #8FBDFF; font-size: 12; animation: hintBlink 1.1s ease-in-out 0s infinite; }

        /* 输入栏：白卡片 + 浅蓝输入框 */
        #composer  { background: #FFFFFF; border: 1px solid #E6EDF7; border-radius: 16; }
        #chatInput { background: #F2F7FF; color: #1F2A37; border: 1px solid #DCE5F2;
                     border-radius: 10; font-size: 15; padding: 8; }
    </style>
</head>
<body>
    <!-- 标题栏 -->
<use src="../../components/titlebar.bum.xml" x="0" y="0" w="960" z="100"
     title="binUI · Galgame Chat" hint="Enter 推进 / 发送 · 拖动标题栏移动" hintw="320"
     idmin="btnMin" idclose="btnClose"/>

    <!-- 舞台：浅色天光渐变 + 两团淡蓝呼吸光斑 -->
    <div style="position:absolute; left:0; top:44; width:960; height:676; background:linear-gradient(to bottom, #F7FAFF, #E3EEFC); z-index:0"></div>
    <div style="position:absolute; left:120; top:126; width:420; height:420; background:#EDF4FE; border-radius:210; z-index:0; animation:glowPulse 4.6s ease-in-out 0s infinite"></div>
    <div style="position:absolute; left:216; top:206; width:260; height:260; background:#E4EFFD; border-radius:130; z-index:0; animation:glowPulse 4.6s ease-in-out 0.9s infinite"></div>

    <!-- 立绘：放大并出底（下缘被底部阅读带压住） -->
    <img id="hero" src="NOELA_N001_1227x1227.png"
         animation="idleBob 3.6s ease-in-out 0s infinite"
         style="position:absolute; left:420; top:60; width:530; height:530; z-index:0"></img>

    <!-- 顶部渐隐（白色薄雾压住立绘顶部，营造舞台纵深） -->
    <div style="position:absolute; left:0; top:44; width:960; height:70; background:rgba(255,255,255,0.72); z-index:0"></div>

    <!-- 底部阅读带：把立绘下缘收进这条带上，避免立绘边缘悬在面板外 -->
    <div style="position:absolute; left:0; top:470; width:960; height:250; background:#EAF2FE; z-index:1"></div>
    <div style="position:absolute; left:0; top:470; width:960; height:1; background:#DCE5F2; z-index:1"></div>

    <!-- HUD -->
    <div style="position:absolute; left:24; top:64; width:300; height:44; background:#FFFFFF; border:1px solid #E6EDF7; border-radius:10; z-index:5">
        <span style="position:absolute; left:14; top:6; width:272; height:18; color:#94A3B8; font-size:11; z-index:6">CHAPTER 01</span>
        <span style="position:absolute; left:14; top:22; width:272; height:18; color:#1F2A37; font-size:13; font-weight:700; z-index:6">与向导的对话</span>
    </div>
    <div style="position:absolute; left:748; top:64; width:188; height:30; background:#FFFFFF; border:1px solid #D3EEE4; border-radius:15; z-index:5">
        <span style="position:absolute; left:14; top:7; width:160; height:16; color:#148A6C; font-size:12; z-index:6">● 在线 · Galgame 模式</span>
    </div>

    <!-- 对话框卡片：抬起底板 + 深墨蓝阅读面板 + 内侧强调条 + 滚动容器 -->
    <div style="position:absolute; left:26; top:502; width:912; height:148; background:#D9E4F2; border-radius:18; z-index:2"></div>
    <div  id="logBg" style="position:absolute; left:24; top:498; width:912; height:148; z-index:3"></div>
    <div style="position:absolute; left:32; top:512; width:3; height:120; background:#5DA0FF; border-radius:2; z-index:3"></div>
    <div  id="log"   style="position:absolute; left:24; top:498; width:912; height:148; overflow:hidden; border-radius:18; z-index:4"></div>
    <span id="hint"  style="position:absolute; left:838; top:618; width:92; height:18; z-index:10">▽ 按 Enter</span>

    <!-- 输入栏（玩家回合显示） -->
    <div id="composer" style="position:absolute; left:24; top:658; width:912; height:50; z-index:10">
        <div style="position:absolute; left:12; top:13; width:3; height:24; background:#2FBF9A; border-radius:2; z-index:11"></div>
        <span style="position:absolute; left:23; top:15; width:40; height:22; color:#148A6C; font-size:15; font-weight:700; z-index:11">你</span>
        <input id="chatInput" style="position:absolute; left:64; top:10; width:742; height:30; z-index:11"></input>
        <span style="position:absolute; left:814; top:16; width:88; height:18; color:#94A3B8; font-size:11; z-index:11">Enter 发送</span>
    </div>
</body>
</html>
