    action   按钮文字（透传给嵌套的 button 组件）
-->

    <span style="height:18px;color:#1F2A37;font-size:13px;font-weight:700" data-param="heading">卡片组件</span>

    <span style="height:8px"></span>
    <button class="cmp-btn" style="position:absolute;width:120px;height:40px;background:#3E8BFF;--w:120px" data-component="button.bum.html" data-w="120" data-label="{{action=确定}}" data-param="action">确定</button>
