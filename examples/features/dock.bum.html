<!--
  dock.bum.html —— 运行期挂载组件（外挂）示范

  编成 dock.bum 后，宿主用这行把它"外挂"上去，运行期由 binui::ex::MountAll()
  把 dock.bum 挂到占位节点下：

      <use src="dock.bum" external x="0" y="792" w="900"/>

  好处：换皮肤 / 插件面板只替换 dock.bum，不用重编主 .bui；有源码时也能现场编译。
-->
<div style="height:48px;background:#FFFFFF;border-top:1px solid #E6EDF7">
    <span style="position:absolute;left:16px;top:16px;width:600px;height:18px;color:#66768C;font-size:12px">状态栏组件：dock.bum 运行期挂载（external）</span>
    <button style="position:absolute;left:696px;top:10px;width:86px;height:28px;background:#EEF3FA;border:1px solid #DFE9F7;border-radius:8px;color:#3E8BFF;font-size:12px">设置</button>
    <button style="position:absolute;left:790px;top:10px;width:86px;height:28px;background:#3E8BFF;border-radius:8px;color:#FFFFFF;font-size:12px">应用</button>
</div>
