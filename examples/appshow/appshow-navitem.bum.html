<!--
  appshow-navitem.bum.html —— 侧栏导航项（多级组件的最内层）
  参数：x / y / w / h / icon / label / id（挂到根节点上，宿主用它 setStyleColor 改底色）
  组件只负责外观：底色由宿主切换（选中/未选中），自己不带状态 —— 这样同一个组件能被
  任何页面复用，选中逻辑只存在于宿主一处。
-->
<style>
    .as-nav      { border-radius:10; background:#FFFFFF; }
    .as-nav:hover { background:#EEF3FA; }
    .as-nav-ico  { font-size:15; color:#3E8BFF; }
    .as-nav-txt  { font-size:13; color:#66768C; }
</style>
<div id="{{nid=}}" class="as-nav" style="position:absolute; left:{{x=8}}; top:{{y=0}}; width:{{w=174}}; height:{{h=40}}">
    <span class="as-nav-ico" style="position:absolute; left:14; top:10; width:20; height:20; color:#3E8BFF">{{icon=■}}</span>
    <span class="as-nav-txt" style="position:absolute; left:42; top:12; width:120; height:18; color:#66768C">{{label=页面}}</span>
</div>
