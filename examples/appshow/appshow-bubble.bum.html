<!--
  appshow-bubble.bum.html —— 池子里的一块半透明组件（这块演示的"最小单位"）

  参数：
    bid  节点名前缀（宿主靠它找齐图层：<bid> / -body / -ring / -t / -s / -tint）
    x y  左上角（池内坐标）
    w h  尺寸（每块都不一样，宿主按它算碰撞/重生）
    r    圆角
    c1 c2  半透明渐变（上 → 下）。**颜色里带 alpha**，重叠处才看得见合成
    rim  1px 边光（描边比填充实，重叠时轮廓还能看清）
    iris 内圈细框（让"组件"有内容层次，不是一块纯色）
    tint 底部色条（宿主每帧改色 → 池子里的颜色一直在漂）
    t s  标题 / 副标题（副标题写尺寸，方便对照"大小不一"）

  为什么用半透明纯色块而不是"泡泡"：
  这块要看的不是"像不像泡泡"，是**两个半透明组件叠在一起时颜色怎么合**——
  alpha 0.3 的两块叠起来不是"更亮"，而是"后面的透过来 70%"。
  所以本体只保留一层带 alpha 的渐变 + 一圈描边，别的装饰越少越好。

  不写自己的 @keyframes：漂移/淡入淡出/色相/戳破全由宿主逐帧设值
  （每块的周期和相位都不同，写进全局 keyframes 会串味，见 docs/ui_orchestration.md）。
-->
<div id="{{bid=b0}}" style="position:absolute; left:{{x=0}}; top:{{y=0}}; width:{{w=160}}; height:{{h=110}}">

    <!-- 1) 本体：半透明双色渐变 + 1px 边光 -->
    <div id="{{bid=b0}}-body"
         style="position:absolute; left:0; top:0; width:100%; height:100%; border-radius:{{r=26}};
                background:linear-gradient(180deg, {{c1=rgba(120,215,255,0.30)}}, {{c2=rgba(150,110,255,0.22)}});
                border:1px solid {{rim=rgba(255,255,255,0.36)}}"></div>

    <!-- 2) 内圈细框：让组件看起来"有内容"，重叠时也能分出层次 -->
    <div id="{{bid=b0}}-ring"
         style="position:absolute; left:7%; top:8%; width:86%; height:84%; border-radius:{{r2=20}};
                border:1px solid {{iris=rgba(255,255,255,0.20)}}"></div>

    <!-- 3) 标题 / 副标题：文字也会跟着半透明一起被"透"过去 -->
    <span id="{{bid=b0}}-t" class="blob-t"
          style="position:absolute; left:12%; top:13%; width:76%; height:26%">{{t=组件}}</span>
    <span id="{{bid=b0}}-s" class="blob-s"
          style="position:absolute; left:12%; top:42%; width:76%; height:22%">{{s=尺寸}}</span>

    <!-- 4) 底部色条：宿主每帧 setStyleColor，颜色在池子里漂 -->
    <div id="{{bid=b0}}-tint"
         style="position:absolute; left:12%; top:74%; width:56%; height:9%; border-radius:999;
                background:{{glow=rgba(125,255,232,0.55)}}"></div>
</div>
