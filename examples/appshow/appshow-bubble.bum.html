<!--
  appshow-bubble.bum.html —— 一颗泡泡（泡泡池里最小的可复用单位）

  参数：
    bid  节点名前缀（宿主靠它把 8 个图层找齐：<bid> / -film / -ring1 / -ring2 / -hi / -dot / -c1 / -c2）
    x y  左上角（池内坐标）
    d    直径（所有内层都是百分比，改 d 就整颗变大变小）
    c1 c2   薄膜渐变（上 → 下）。两色**不同色相**，中间那段是插值出来的虹彩
    rim     外圈 1px 边光（最亮的一圈）
    iris1 iris2  紧贴边光的内侧两道细环（离边 1.5% / 3.5%）：膜厚产生的彩色边
    glow1 glow2  反光斑（下/上各一，宿主每帧改色 → 整池子的颜色在漂）

  画法为什么是"边亮、中间空"：深色底上的皂膜，视觉信息几乎全在边缘一圈
  （薄膜厚度渐变 → 干涉色），中间是透过去的背景。所以本体只给很淡的染色
  （alpha 0.20 → 0.10），靠 1px 边光 + 两道虹彩环把轮廓"立"起来。

  为什么不写自己的 @keyframes：漂移/呼吸/色相**全部由宿主逐帧设值**
  （每颗泡泡的周期和相位都不同，写进全局 keyframes 会串味，见 docs/ui_orchestration.md）。
-->
<div id="{{bid=b0}}" style="position:absolute; left:{{x=0}}; top:{{y=0}}; width:{{d=96}}; height:{{d=96}}">

    <!-- 1) 薄膜本体：双色渐变（上 → 下）+ 1px 边光。圆角写 999 = 圆 -->
    <div id="{{bid=b0}}-film"
         style="position:absolute; left:0; top:0; width:100%; height:100%; border-radius:999;
                background:linear-gradient(180deg, {{c1=rgba(120,215,255,0.20)}}, {{c2=rgba(140,120,255,0.10)}});
                border:1px solid {{rim=rgba(225,245,255,0.64)}}"></div>

    <!-- 2) 虹彩环 1：离边 1.5%，贴着边光 -->
    <div id="{{bid=b0}}-ring1"
         style="position:absolute; left:1.5%; top:1.5%; width:97%; height:97%; border-radius:999;
                border:1px solid {{iris1=rgba(140,255,235,0.50)}}"></div>

    <!-- 3) 虹彩环 2：离边 3.5%，另一色相（两道环错开 = 膜的两层反射） -->
    <div id="{{bid=b0}}-ring2"
         style="position:absolute; left:3.5%; top:3.5%; width:93%; height:93%; border-radius:999;
                border:1px solid {{iris2=rgba(255,170,235,0.38)}}"></div>

    <!-- 4) 主高光：胶囊形，白色渐变到透明（没有模糊通道，用渐变假装柔边） -->
    <div id="{{bid=b0}}-hi"
         style="position:absolute; left:21%; top:12%; width:25%; height:15%; border-radius:999;
                background:linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.0))"></div>

    <!-- 5) 反光点：高光下方那颗更小的实心白点 -->
    <div id="{{bid=b0}}-dot"
         style="position:absolute; left:28%; top:30%; width:5.5%; height:5.5%; border-radius:999;
                background:#FFFFFF"></div>

    <!-- 6) 底部反光：贴着下缘的一条弧光（宿主每帧 setStyleColor → 池子里的颜色在漂） -->
    <div id="{{bid=b0}}-c1"
         style="position:absolute; left:12%; top:76%; width:76%; height:9%; border-radius:999;
                background:{{glow1=rgba(125,255,232,0.14)}}"></div>

    <!-- 7) 侧上反光：和底部反光反相位，两个色斑叠出"五彩斑斓" -->
    <div id="{{bid=b0}}-c2"
         style="position:absolute; left:44%; top:24%; width:38%; height:8%; border-radius:999;
                background:{{glow2=rgba(255,150,230,0.12)}}"></div>
</div>
