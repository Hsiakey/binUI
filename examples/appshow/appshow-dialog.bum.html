<!--
  appshow-dialog.bum.html —— 弹窗（组件 + 运行时 API 的结合）
  参数：x / y / w / h / idt / idb / idc / idok（标题/正文/取消/确定 的节点名）
  正文由宿主 setText 改（被动查询结果、确认文案都走这里），所以组件本身不带业务。
  弹窗的进出场动画**不写在这里**：进场是"容器的事"，由宿主对这台组件的根节点做 tween。
-->
<style>
    .as-dlg      { background:#FFFFFF; border:1px solid #E6EDF7; border-radius: 16px; }
    .as-dlg-t    { font-size: 15px; font-weight:700; color:#1F2A37; }
    .as-dlg-b    { font-size: 12px; color:#66768C; }
    .as-dlg-ok   { background:#3E8BFF; color:#FFFFFF; border-radius: 9px; font-size: 12px; }
    .as-dlg-ok:hover   { background:#5DA0FF; }
    .as-dlg-ok:active  { background:#2F79E8; }
    .as-dlg-no   { background:#EEF3FA; color:#3E8BFF; border-radius: 9px; font-size: 12px; }
    .as-dlg-no:hover   { background:#E1EBFA; }
</style>

    <span id="{{idt=dlg-title}}" class="as-dlg-t" style="position:absolute;left:22px;top:20px;width:280px;height:20px">弹窗标题</span>
    <div style="position:absolute;left:22px;top:52px;width:356px;height:1px;background:#E6EDF7"></div>
    <span id="{{idb=dlg-body}}" class="as-dlg-b" style="position:absolute;left:22px;top:72px;width:356px;height:120px">正文</span>
    <div style="position:absolute;left:22px;top:250px;width:356px;height:1px;background:#E6EDF7"></div>
    <button id="{{idc=dlg-cancel}}" class="as-dlg-no" style="position:absolute;left:196px;top:262px;width:84px;height:28px">取消</button>
    <button id="{{idok=dlg-ok}}" class="as-dlg-ok" style="position:absolute;left:292px;top:262px;width:84px;height:28px">确定</button>
