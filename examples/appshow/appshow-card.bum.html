<!--
  appshow-card.bum.html —— 指标卡（组件级微动画的示范）
  参数：x / y / w / h / title / value / unit / trend / tone（blue/mint/amber/coral）
  卡片内部那个小圆点有自己的呼吸动画：**命名空间是全局的**（组件会被内联进同一个文档），
  所以 keyframes 一律带 `as-` 前缀，避免和别的组件同名串味。
-->
<style>
    .as-card      { background:#FFFFFF; border:1px solid #E6EDF7; border-radius:14; }
    .as-card-t    { font-size:12; color:#94A3B8; }
    .as-card-v    { font-size:26; font-weight:700; color:#1F2A37; }
    .as-card-u    { font-size:12; color:#66768C; }
    .as-card-dot  { border-radius:5; }
    .as-card-dot.blue  { background:#3E8BFF; }
    .as-card-dot.mint  { background:#2FBF9A; }
    .as-card-dot.amber { background:#F2B544; }
    .as-card-dot.coral { background:#FF8A65; }
    .as-card-tr   { font-size:11; color:#2FBF9A; }
    /* 只动 scale、不动 opacity：带 opacity 的关键帧会让宿主后来的 opacity tween 失效
       （drawOpacity 先看动画结果、后看 floatTargets），页面淡出时这些小点会留在原地。 */
    @keyframes as-breathe {
        0%, 100% { transform: scale(1);   }
        50%      { transform: scale(1.7); }
    }
</style>
<div class="as-card" style="position:absolute; left:{{x=0}}; top:{{y=0}}; width:{{w=250}}; height:{{h=110}}">
    <span class="as-card-dot {{tone=blue}}" style="position:absolute; left:20; top:22; width:10; height:10"
          animation="as-breathe 2.4s ease-in-out 0s infinite"></span>
    <span class="as-card-t" style="position:absolute; left:20; top:40; width:180; height:16">{{title=指标}}</span>
    <span class="as-card-v" style="position:absolute; left:20; top:58; width:150; height:32">{{value=0}}</span>
    <span class="as-card-u" style="position:absolute; left:20; top:88; width:150; height:16">{{unit=单位}}</span>
    <span class="as-card-tr" style="position:absolute; left:180; top:64; width:56; height:18">{{trend=+0%}}</span>
</div>
